<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" type="style">
    <title>Archē | Effortless Voice Dictation</title>
</head>

<style>
    body {
        background-color: beige;
        margin: 0px;
    }

    .nav-bar {
        max-height: 60px;
        height: 60px;
        background-color: greenyellow;
        border-radius: 45px;
    }

    .navlogo {
        padding-top: 5px;
        padding-left: 5px;
        max-height: 50px;
        height: 60px;
        border-radius: 45px;
    }

    .hero-text1 {
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        text-align: center;
        color: gray;
        font-size: 70px;
        padding-top: 70px;
        padding-bottom: 0px;
    }

    .hero-text2 {
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        text-align: center;
        color: dimgrey;
        font-size: 72px;
    }

    .windows-button {
        text-align: center;
        height: 40px;
        outline-width: 0px;
        background-color: greenyellow;
        font-style: italic;
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
    }

    .button {
        text-align: center;
        padding-top: 20px;
    }

    .section1 {
        background-color: darkcyan;
        height: 200px;
        border-top-left-radius: 60px;
        border-top-right-radius: 60px;
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        color: beige;
        font-size: 25px;
        text-align: center;
        padding-top: 20px;
        padding-bottom: 10px;
    }

    .cover {
        margin: 7px;
    }

    .step1 {
        margin: 5px;
        background-color: beige;
        height: 50px;
    }

    .step2 {
        margin: 5px;
        background-color: beige;
        height: 50px;
    }

    .step3 {
        margin: 5px;
        background-color: beige;
        height: 50px;
    }
</style>

<body>
    <div class="cover">
        <div class="nav-bar">
            <nav>
                <img class="navlogo" src="logo.jpg">
            </nav>
        </div>
        <div class="hero-section">
            <div class="hero-text1">
                Prompt Quicker,
            </div>
            <div class="hero-text2">
                Like Never Before
            </div>
            <div class="button">
                <button class="windows-button">Download for Windows</button>
            </div>
        </div>
    </div>
    <br>
    <br>
    <div class="section1">
        Steps to get quicker while typing...
        <div class="step1"></div>
        <div class="step2"></div>
        <div class="step3"></div>
    </div>
</body>

</html>
